name: Backend

on:
  push:
    paths: ["amatchwebsiteupload/backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["amatchwebsiteupload/backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amatchwebsiteupload/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: amatchwebsiteupload/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy amatch_checker checker_server.py
      - name: Tests
        run: pytest
