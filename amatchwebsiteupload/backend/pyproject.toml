[project]
name = "amatch-checker"
version = "1.1.0"
description = "Content audit for job ads, behind the A Match 'Stellenanzeigen-Check'."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "C4", "PT", "RET"]
ignore = [
  "RUF001",  # typographic quotes in localized strings are intentional
  "RUF002",  # en dashes in docstrings
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "E501"]  # asserts, IP fixtures, long parametrize lines

[tool.mypy]
strict = true
ignore_missing_imports = true
